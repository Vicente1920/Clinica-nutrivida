<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar cita | NutriVida</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <header>
    <h1>NutriVida</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="agendar.html" aria-current="page">Agendar cita</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Agenda tu cita</h2>

      <form id="form-agendar" novalidate>

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" autocomplete="name" required>
        <p class="texto-error" id="error-nombre"></p>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" autocomplete="email" required>
        <p class="texto-error" id="error-correo"></p>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" autocomplete="tel" required>
        <p class="texto-error" id="error-telefono"></p>

        <label for="nutricionista">Nutricionista preferido</label>
        <select id="nutricionista" required>
          <option value="">Selecciona un nutricionista</option>
          <option>Carolina Fuentes - Obesidad y síndrome metabólico</option>
          <option>Rodrigo Sepúlveda - Nutrición deportiva y rendimiento</option>
          <option>Daniela Morales - Vegetariana, vegana y trastornos alimentarios</option>
          <option>Felipe Araya - Nutrición pediátrica y familiar</option>
        </select>
        <p class="texto-error" id="error-nutricionista"></p>

        <label for="servicio">Motivo de la consulta</label>
        <select id="servicio" required>
          <option value="">Selecciona un servicio</option>
          <optgroup label="Consultas">
            <option>Primera consulta nutricional</option>
            <option>Control nutricional (seguimiento)</option>
            <option>Control nutricional quincenal</option>
            <option>Teleconsulta nutricional</option>
            <option>Consulta de urgencia / reagendada</option>
          </optgroup>
          <optgroup label="Planes especializados">
            <option>Plan pérdida de peso (1 mes)</option>
            <option>Plan pérdida de peso (3 meses)</option>
            <option>Plan nutrición deportiva</option>
            <option>Plan control diabetes / hipertensión</option>
            <option>Plan alimentación vegetariana/vegana</option>
            <option>Plan alimentación infantil</option>
          </optgroup>
          <optgroup label="Evaluaciones">
            <option>Antropometría completa</option>
            <option>Bioimpedanciometría</option>
            <option>Encuesta de hábitos alimentarios</option>
            <option>Análisis de exámenes de laboratorio</option>
          </optgroup>
          <optgroup label="Talleres grupales">
            <option>Taller de alimentación saludable</option>
            <option>Taller de cocina nutritiva</option>
            <option>Taller nutrición para deportistas</option>
          </optgroup>
        </select>
        <p class="texto-error" id="error-servicio"></p>

        <label for="fecha">Fecha preferida</label>
        <input type="date" id="fecha" required>
        <p class="texto-error" id="error-fecha"></p>

        <label for="comentario">Comentario adicional</label>
        <textarea id="comentario"></textarea>

        <button type="submit">Confirmar solicitud</button>
        <p id="mensaje-confirmacion"></p>
      </form>
    </section>
  </main>

  <footer>
    <p><strong>Clínica NutriVida</strong> — Av. Alemania 1234, Temuco</p>
    <p>+56 45 234 5678 · Lunes a sábado, 08:00 a 19:00</p>
    <p><a href="index.html">Inicio</a> | <a href="servicios.html">Servicios</a> | <a href="contacto.html">Contacto</a></p>
  </footer>

  <script src="js/validacion.js"></script>
</body>
</html>
